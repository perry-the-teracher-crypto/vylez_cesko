<!doctype html>
<html lang="cs">
<head>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ2x01Mvf5V8ASaYVtL/+wR6E1SR8dY=" crossorigin="">
  <style>
    :root{--ink:#152b23;--pine:#1e6049;--mint:#dcefe4;--paper:#f8f5ed;--coral:#e66e58;--sand:#e9e2d3;--muted:#63736c;--line:#d8d0c2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100vh;display:grid;grid-template-columns:410px 1fr;overflow:hidden}.sidebar{background:#fffdf8;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:2}.brand{padding:24px 23px 17px;background:var(--ink);color:#fff}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#cde991}.brand h1{margin:5px 0 5px;font-size:34px;letter-spacing:-.055em;line-height:.95}.brand p{color:#c9d6cf;margin:0;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 18px 10px;background:#f6f2e9}.stat{border-left:2px solid var(--pine);padding-left:8px}.stat b{display:block;font-size:20px}.stat span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.filters{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;gap:8px;grid-template-columns:1fr 120px}.filters input,.filters select{appearance:none;width:100%;border:1px solid var(--line);background:#fffcf5;border-radius:9px;padding:9px;color:var(--ink);outline-color:var(--pine)}.list{overflow:auto;flex:1;padding:0 12px}.place{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:center;padding:12px 6px;border-bottom:1px solid #efeae0;cursor:pointer}.place:hover{background:#f8f7f2}.place.done .name{text-decoration:line-through;color:var(--muted)}.check{appearance:none;width:19px;height:19px;border:2px solid #98aaa0;border-radius:5px;display:grid;place-content:center;margin:0;cursor:pointer}.check:checked{border-color:var(--coral);background:var(--coral)}.check:checked:after{content:"✓";color:#fff;font-weight:900;font-size:13px}.name{font-weight:760;line-height:1.2}.meta{font-size:11px;color:var(--muted);margin-top:2px}.type{font-size:9px;padding:4px 5px;border-radius:5px;color:#5d6e66;background:var(--sand);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}.map-zone{position:relative;min-width:0}.map{height:100%;width:100%;background:#dae6dc}.map-note{position:absolute;z-index:500;right:18px;bottom:26px;background:#fffdf8e8;border:1px solid var(--line);padding:8px 11px;border-radius:8px;font-size:11px;color:var(--muted);box-shadow:0 5px 16px #152b2314}.pin{width:17px;height:17px;border:3px solid white;border-radius:50%;background:var(--pine);box-shadow:0 2px 6px #19382a77;transition:transform .15s}.pin:hover{transform:scale(1.4)}.pin.done{background:var(--coral)}.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 10px 30px #13291d33}.leaflet-popup-content{margin:14px 15px;width:220px!important}.pop-name{font-weight:800;font-size:16px;line-height:1.15}.pop-meta{font-size:12px;color:var(--muted);margin:4px 0 11px}.pop-links{display:flex;gap:7px;flex-wrap:wrap}.pop-links a{font-weight:700;font-size:12px;color:var(--pine);text-decoration:none}.empty{padding:25px 8px;color:var(--muted);text-align:center}.toolbar{display:flex;gap:7px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}.btn{background:#fff;border:1px solid #cbd7cf;color:var(--pine);font-size:11px;font-weight:750;padding:7px 8px;border-radius:7px;cursor:pointer}.btn:hover{background:#ecf6ef}.btn.danger{color:#a34735}.modal{position:fixed;z-index:1000;inset:0;background:#10251a8c;display:none;place-items:center;padding:18px}.modal.open{display:grid}.dialog{width:min(460px,100%);border-radius:16px;background:#fffdf8;padding:23px;box-shadow:0 25px 65px #0b1b1355}.dialog h2{font-size:25px;line-height:1;margin:0 0 6px}.dialog p{margin:0 0 14px;color:var(--muted)}.dialog label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px}.dialog input,.dialog textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}.dialog textarea{height:80px;resize:vertical}.dialog-foot{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:16px}.primary{border:0;border-radius:8px;padding:9px 12px;background:var(--pine);color:#fff;font-weight:800;cursor:pointer}.close{border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer}@media(max-width:760px){.app{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:auto 58vh}.sidebar{max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:16px 18px 13px}.brand h1{font-size:29px}.stats{padding:9px 16px}.place{padding:9px 6px}.toolbar{padding:8px 14px}.filters{padding:9px 14px}.map-note{right:9px;bottom:14px}.list{display:none}.sidebar:has(.filters input:focus) .list{display:block;position:absolute;z-index:20;top:218px;bottom:0;width:100%;background:#fffdf8}}

<body>
  <main class="app">

  ].map((v,i)=>({id:'v'+i,name:v[0],city:v[1],type:v[2],lat:v[3],lon:v[4],url:v[5]}));
  const labels={lano:'Lano',boulder:'Boulder',oboji:'Lano + boulder'},key='vylezCeskoWebV1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
  const $=s=>document.querySelector(s),modal=$('#modal'),dialog=$('#dialog'),markers=new Map();
  const map=L.map('map',{zoomControl:false,attributionControl:false,minZoom:7,maxZoom:15}).setView([49.81,15.45],7);
  L.control.zoom({position:'bottomright'}).addTo(map);L.control.attribution({prefix:false,position:'bottomleft'}).addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>').addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  const done=v=>!!state[v.id]?.visited,gm=v=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v.name+' '+v.city);
  function icon(v){return L.divIcon({className:'',html:`<div class="pin ${done(v)?'done':''}"></div>`,iconSize:[17,17],iconAnchor:[8,8]})}

  function matches(v){const q=$('#search').value.toLowerCase().trim(),t=$('#typeFilter').value;return (t==='all'||v.type===t)&&(`${v.name} ${v.city}`.toLowerCase().includes(q))}
  function repaint(){const vs=V.filter(matches);markers.forEach(m=>map.removeLayer(m));markers.clear();vs.forEach(v=>{const m=L.marker([v.lat,v.lon],{icon:icon(v),title:v.name}).addTo(map).bindPopup(popup(v));m.on('popupopen',()=>document.querySelector('.detailLink')?.addEventListener('click',e=>{e.preventDefault();openModal(v)}));markers.set(v.id,m)});const n=V.filter(done).length;$('#visitedN').textContent=n;$('#totalN').textContent=V.length;$('#citiesN').textContent=new Set(V.filter(done).map(v=>v.city)).size;$('#list').innerHTML=vs.length?'':`<div class="empty">Nic nenalezeno.</div>`;vs.forEach(v=>{const el=document.createElement('div');el.className='place '+(done(v)?'done':'');el.innerHTML=`<input class="check" type="checkbox" ${done(v)?'checked':''} aria-label="Navštíveno: ${v.name}"><div><div class="name">${v.name}</div><div class="meta">${v.city}</div></div><span class="type">${labels[v.type]}</span>`;el.querySelector('input').onchange=e=>{state[v.id]={...(state[v.id]||{}),visited:e.target.checked,date:e.target.checked?(state[v.id]?.date||new Date().toISOString().slice(0,10)):''};save()};el.onclick=e=>{if(e.target.type!=='checkbox'){map.setView([v.lat,v.lon],12,{animate:true});markers.get(v.id).openPopup()}};$('#list').append(el)})}
  function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}repaint()}
  function openModal(v){const s=state[v.id]||{};dialog.innerHTML=`<button class="close" id="closeModal">× Zavřít</button><h2>${v.name}</h2><p>${v.city} · ${labels[v.type]}</p><p><a href="${v.url}" target="_blank" rel="noopener">Oficiální web</a> · <a href="${gm(v)}" target="_blank" rel="noopener">Google Maps a hodnocení</a></p><label>Datum návštěvy</label><input id="date" type="date" value="${s.date||''}"><label>Poznámka z výpravy</label><textarea id="note" placeholder="První 6a, dobrý stavěč, kafe...">${s.note||''}</textarea><div class="dialog-foot"><label style="margin:0;display:flex;gap:7px;align-items:center"><input id="visit" type="checkbox" ${s.visited?'checked':''}> Navštíveno</label><button class="primary" id="saveVisit">Uložit</button></div>`;modal.classList.add('open');$('#closeModal').onclick=closeModal;$('#saveVisit').onclick=()=>{state[v.id]={visited:$('#visit').checked,date:$('#date').value,note:$('#note').value.trim()};save();closeModal()}}
  function closeModal(){modal.classList.remove('open')}modal.onclick=e=>{if(e.target===modal)closeModal()};$('#search').oninput=repaint;$('#typeFilter').onchange=repaint;
  $('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,visits:state},null,2)],{type:'application/json'}));a.download='vylez-cesko-postup.json';a.click();URL.revokeObjectURL(a.href)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{try{state=JSON.parse(r.result).visits||{};save()}catch{alert('Soubor se nepodařilo načíst.')}};r.readAsText(f)};$('#resetBtn').onclick=()=>{if(confirm('Vymazat všechny návštěvy?')){state={};save()}};repaint();
